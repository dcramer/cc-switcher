name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Every build gets its own version; builds of main are released under it.
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      # Self-contained, so the installer has no .NET prerequisite.
      - name: Publish
        run: >
          dotnet publish src/CcSwitcher/CcSwitcher.csproj -c Release -r win-x64
          --self-contained true -p:Version=${{ env.VERSION }} -o publish --nologo

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\cc-switcher.iss
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: cc-switcher-setup
          path: dist/cc-switcher-setup.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cc-switcher-setup

      # A re-run keeps its run number, so the release may already exist.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          gh release create "v$VERSION" cc-switcher-setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
